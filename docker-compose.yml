services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: inventure-web:local
    ports:
      - "3000:3000"
    environment:
      CMS_PROVIDER: ${CMS_PROVIDER:-mock}
      CMS_URL: ${CMS_URL:-}
      CMS_TOKEN: ${CMS_TOKEN:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    restart: unless-stopped

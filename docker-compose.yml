services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directus}
      POSTGRES_DB: ${POSTGRES_DB:-directus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-directus} -d ${POSTGRES_DB:-directus}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - inventure

  directus:
    image: directus/directus:11
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8055:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-inventure-directus-key}
      SECRET: ${DIRECTUS_SECRET:-inventure-directus-secret}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@inventure.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-change-me-admin}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-directus}
      DB_USER: ${POSTGRES_USER:-directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-directus}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      WEBSOCKETS_ENABLED: "true"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8055/server/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - inventure

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: inventure-web:local
    depends_on:
      directus:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      CMS_PROVIDER: directus
      CMS_URL: http://directus:8055
      CMS_TOKEN: ${CMS_TOKEN:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    restart: unless-stopped
    networks:
      - inventure

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:

networks:
  inventure:
    driver: bridge
